    <!-- Country / Regional Detection & Locale Adaptation -->
    <script>
      (function() {
        try {
          var userLang = navigator.language || (navigator.languages && navigator.languages[0]) || 'en';
          var tz = '';
          try {
            tz = Intl.DateTimeFormat().resolvedOptions().timeZone || '';
          } catch(e) {}

          var detectedLocale = 'en-US';
          var detectedCountry = 'Global';

          // Detect specific countries like Singapore, Australia, UK, India, etc.
          if (tz.indexOf('Singapore') !== -1 || userLang.indexOf('SG') !== -1) {
            detectedLocale = 'en-SG';
            detectedCountry = 'Singapore';
          } else if (tz.indexOf('Australia') !== -1 || tz.indexOf('Sydney') !== -1 || tz.indexOf('Melbourne') !== -1 || userLang.indexOf('AU') !== -1) {
            detectedLocale = 'en-AU';
            detectedCountry = 'Australia';
          } else if (tz.indexOf('London') !== -1 || userLang.indexOf('GB') !== -1) {
            detectedLocale = 'en-GB';
            detectedCountry = 'United Kingdom';
          } else if (tz.indexOf('Kolkata') !== -1 || tz.indexOf('Calcutta') !== -1 || userLang.indexOf('IN') !== -1) {
            detectedLocale = 'en-IN';
            detectedCountry = 'India';
          } else if (tz.indexOf('America') !== -1 || userLang.indexOf('US') !== -1) {
            detectedLocale = 'en-US';
            detectedCountry = 'United States';
          }

          // Save detected context for client-side state
          window.__REGION_INFO__ = {
            detectedLocale: detectedLocale,
            detectedCountry: detectedCountry,
            timeZone: tz,
            userBrowserLang: userLang
          };

          // Set HTML lang attribute dynamically
          var savedLang = localStorage.getItem('mbmct_lang');
          if (savedLang) {
            document.documentElement.lang = savedLang;
          } else {
            document.documentElement.lang = detectedLocale;
          }
        } catch(err) {
          document.documentElement.lang = 'en';
        }
      })();
    </script>
